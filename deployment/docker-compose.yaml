services:

  postgres:
    image: postgres:17
    container_name: coding-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: coding_agent
      POSTGRES_PASSWORD: coding_agent_password
      POSTGRES_DB: coding_agent

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coding_agent"]
      interval: 5s
      timeout: 5s
      retries: 5


  adminer:
    image: adminer:latest
    container_name: coding-agent-adminer
    restart: unless-stopped

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy


  redis:
    image: redis:7-alpine
    container_name: coding-agent-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data: